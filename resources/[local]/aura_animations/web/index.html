<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraRP - Panel de Animaciones</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: transparent !important; background-color: transparent !important;">

    <div id="app" class="aura-app" style="display: none;">
        <!-- Modal / Side Panel Container -->
        <div class="aura-container">
            
            <!-- HEADER -->
            <header class="aura-header">
                <div class="brand-section">
                    <div class="brand-logo-glow"></div>
                    <div class="brand-text">
                        <div class="brand-title">
                            <span class="gradient-text">AURA</span>
                            <span class="brand-badge">PRO</span>
                        </div>
                        <span class="brand-subtitle">SISTEMA DE ANIMACIONES</span>
                    </div>
                </div>

                <!-- Quick Action Buttons -->
                <div class="quick-actions">
                    <button id="btn-cancel-anim" class="quick-btn btn-danger" title="Cancelar animación actual (Tecla X)">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="15" y1="9" x2="9" y2="15"></line>
                            <line x1="9" y1="9" x2="15" y2="15"></line>
                        </svg>
                        <span>Detener</span>
                        <kbd>X</kbd>
                    </button>

                    <button id="btn-reset-walk" class="quick-btn btn-secondary" title="Restablecer estilo de andar">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M13 4v16M17 8l-4-4-4 4M4 20h16"></path>
                        </svg>
                        <span>Reset Paso</span>
                    </button>

                    <button id="btn-reset-mood" class="quick-btn btn-secondary" title="Restablecer expresión facial">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="8" y1="15" x2="16" y2="15"></line>
                            <line x1="9" y1="9" x2="9.01" y2="9"></line>
                            <line x1="15" y1="9" x2="15.01" y2="9"></line>
                        </svg>
                        <span>Reset Cara</span>
                    </button>

                    <button id="btn-close-ui" class="quick-btn btn-close" title="Cerrar panel (ESC)">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                        <kbd>ESC</kbd>
                    </button>
                </div>
            </header>

            <!-- SEARCH BAR & STATS -->
            <div class="search-toolbar">
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="search-input" placeholder="Buscar animación, baile, caminata o comando (/e dance)..." autocomplete="off" spellcheck="false">
                    <button id="search-clear" class="search-clear-btn" style="display: none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="results-counter">
                    <span id="results-count">0</span> animaciones
                </div>
            </div>

            <!-- CATEGORY NAVIGATION WRAPPER WITH SCROLL ARROWS -->
            <div class="category-nav-wrapper">
                <button class="tab-nav-arrow arrow-left" id="tab-arrow-left" title="Desplazar a la izquierda">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <nav class="category-tabs" id="category-tabs">
                    <button class="tab-btn" data-category="favorites">
                        <span class="tab-icon">⭐</span>
                        <span class="tab-label">Favoritos</span>
                        <span class="tab-badge" id="fav-count">0</span>
                    </button>
                    <button class="tab-btn active" data-category="dances">
                        <span class="tab-icon">💃</span>
                        <span class="tab-label">Bailes</span>
                    </button>
                    <button class="tab-btn" data-category="poses">
                        <span class="tab-icon">🧍</span>
                        <span class="tab-label">Posturas</span>
                    </button>
                    <button class="tab-btn" data-category="props">
                        <span class="tab-icon">📦</span>
                        <span class="tab-label">Objetos</span>
                    </button>
                    <button class="tab-btn" data-category="walks">
                        <span class="tab-icon">🚶</span>
                        <span class="tab-label">Caminar</span>
                    </button>
                    <button class="tab-btn" data-category="expressions">
                        <span class="tab-icon">😊</span>
                        <span class="tab-label">Expresiones</span>
                    </button>
                    <button class="tab-btn" data-category="shared">
                        <span class="tab-icon">🤝</span>
                        <span class="tab-label">Sincronizadas</span>
                    </button>
                </nav>
                <button class="tab-nav-arrow arrow-right" id="tab-arrow-right" title="Desplazar a la derecha">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </div>

            <!-- ANIMATIONS GRID CONTAINER -->
            <main class="animations-viewport">
                <div class="animations-grid" id="animations-grid">
                    <!-- Cards will be dynamically injected here -->
                </div>

                <!-- Empty State Message -->
                <div class="empty-state" id="empty-state" style="display: none;">
                    <div class="empty-state-icon" id="empty-icon">🔍</div>
                    <h3 class="empty-state-title" id="empty-title">Sin resultados</h3>
                    <p class="empty-state-desc" id="empty-desc">No se encontró ninguna animación que coincida.</p>
                </div>
            </main>

            <!-- FOOTER BAR -->
            <footer class="aura-footer">
                <div class="footer-hint">
                    <span class="hint-pill"><kbd>CLIC</kbd> Reproducir</span>
                    <span class="hint-pill"><kbd>⭐</kbd> Fijar Favorito</span>
                    <span class="hint-pill"><kbd>X</kbd> Cancelar</span>
                    <span class="hint-pill"><kbd>ESC</kbd> Salir</span>
                </div>
                <div class="footer-status">
                    <span class="status-indicator"></span>
                    <span class="status-text">RPEmotes Conectado</span>
                </div>
            </footer>

        </div>
    </div>

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="toast-container"></div>

    <script src="js/app.js"></script>
</body>
</html>
