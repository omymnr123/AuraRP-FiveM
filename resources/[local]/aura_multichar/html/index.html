<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura MultiChar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="background-overlay"></div>
        
        <header class="logo-container">
            <h1>AURA</h1>
            <p>SISTEMA DE IDENTIDAD</p>
        </header>

        <!-- Selección de Personaje -->
        <main id="character-selection" class="screen active">
            <div class="slots-container" id="slots-container">
                <!-- Se llenará vía JS -->
            </div>
            
            <div class="character-info-panel glass-panel" id="char-info-panel">
                <h2 id="info-name">SELECCIONA UN PERFIL</h2>
                <div class="info-details">
                    <p><span>Nacionalidad:</span> <span id="info-nationality">-</span></p>
                    <p><span>Fecha de Nac.:</span> <span id="info-dob">-</span></p>
                </div>
                <button class="btn-primary" id="btn-play" disabled>ENTRAR AL MUNDO</button>
                <button class="btn-danger" id="btn-delete" disabled>BORRAR REGISTRO</button>
            </div>
        </main>

        <!-- Creación de Personaje -->
        <main id="character-creation" class="screen">
            <div class="creation-panel glass-panel">
                <h2>NUEVA IDENTIDAD</h2>
                <form id="creation-form">
                    <div class="form-group">
                        <input type="text" id="firstname" required placeholder=" ">
                        <label for="firstname">Nombre</label>
                    </div>
                    <div class="form-group">
                        <input type="text" id="lastname" required placeholder=" ">
                        <label for="lastname">Apellido</label>
                    </div>
                    <div class="form-group">
                        <select id="nationality" required>
                            <option value="" disabled selected hidden>Selecciona un país</option>
                        </select>
                        <label class="static-label">Nacionalidad</label>
                    </div>
                    <div class="form-group">
                        <input type="date" id="dob" required>
                        <label class="static-label">Fecha de Nacimiento</label>
                    </div>
                    <div class="form-group gender-selector">
                        <label class="static-label">Género Físico</label>
                        <div class="radio-group">
                            <input type="radio" id="gender-m" name="gender" value="0" checked>
                            <label for="gender-m">Masculino</label>
                            
                            <input type="radio" id="gender-f" name="gender" value="1">
                            <label for="gender-f">Femenino</label>
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" class="btn-secondary" id="btn-cancel-create">CANCELAR</button>
                        <button type="submit" class="btn-primary">REGISTRAR</button>
                    </div>
                </form>
            </div>
        </main>
        <!-- Modal Confirmación Borrado -->
        <div id="delete-modal" class="modal-overlay" style="display: none;">
            <div class="modal-content glass-panel">
                <h2>¿ESTÁS SEGURO?</h2>
                <p>Estás a punto de eliminar permanentemente esta identidad. Todo su progreso se perderá y la acción es irreversible.</p>
                <div class="form-actions" style="margin-top: 25px;">
                    <button type="button" class="btn-secondary" id="btn-cancel-delete">CANCELAR</button>
                    <button type="button" class="btn-danger" id="btn-confirm-delete">BORRAR</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
