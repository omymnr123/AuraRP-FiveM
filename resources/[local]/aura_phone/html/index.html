<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura OS V2</title>
    <!-- CSS Core -->
    <link rel="stylesheet" href="css/os.css">
    <link rel="stylesheet" href="css/apps.css">
    <!-- FontAwesome Pro (Simulated via CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="phone-container" class="hidden">
        
        <!-- Hardware Frame (The Physical Phone) -->
        <div class="phone-hardware">
            <!-- Dynamic Island / Notch -->
            <div class="dynamic-island" id="dynamic-island">
                <div class="island-camera"></div>
                <div class="island-sensor"></div>
                <span id="island-text" class="hidden"></span>
            </div>
            
            <!-- Phone Screen Area -->
            <div class="phone-screen">
                
                <!-- Status Bar -->
                <div class="status-bar">
                    <span class="time" id="clock">12:00</span>
                    <div class="icons">
                        <i class="fas fa-signal"></i>
                        <i class="fas fa-wifi"></i>
                        <i class="fas fa-battery-three-quarters"></i>
                    </div>
                </div>

                <!-- Main Home Screen (Grid & Widgets) -->
                <div id="home-screen" class="view-layer active">
                    <!-- Widgets Area (Top) -->
                    <div class="widgets-area">
                        <div class="widget time-widget">
                            <h1 id="widget-time">12:00</h1>
                            <p id="widget-date">Lunes, 1 Enero</p>
                        </div>
                    </div>

                    <!-- Dynamic App Grid -->
                    <div class="app-grid" id="app-grid">
                        <!-- JS Inyecta las apps aquí -->
                    </div>
                    
                    <!-- App Dock -->
                    <div class="dock-container">
                        <div class="dock" id="app-dock">
                            <!-- JS Inyecta las apps de dock aquí -->
                        </div>
                    </div>
                </div>

                <!-- Control Center (Swipe down) -->
                <div id="control-center" class="view-layer">
                    <div class="cc-panel">
                        <h3>Centro de Control</h3>
                        <!-- Contenido del CC a futuro -->
                    </div>
                </div>

                <!-- Dynamic Apps Container -->
                <div id="apps-container">
                    <!-- Las ventanas de las apps se renderizan dentro de aquí vía JS -->
                </div>



                <!-- Lock Screen (Seguridad / PIN / Face ID) -->
                <div id="lock-screen" class="view-layer hidden">
                    <div class="lock-screen-content">
                        <div class="lock-header">
                            <div class="lock-icon-box" id="lock-padlock-icon">
                                <i class="fas fa-lock"></i>
                            </div>
                            <h1 id="lock-time">12:00</h1>
                            <p id="lock-date">Lunes, 31 de Agosto</p>
                        </div>

                        <!-- Face ID Dynamic Banner (opcional en pantalla) -->
                        <div id="lock-faceid-banner" class="faceid-banner hidden">
                            <i class="fas fa-smile fa-spin"></i>
                            <span>Verificando Face ID...</span>
                        </div>

                        <!-- Keypad PIN Container -->
                        <div id="lock-pin-container" class="lock-pin-container">
                            <p class="pin-prompt-text">Introduce el código</p>
                            <div class="pin-dots">
                                <div class="pin-dot" id="pdot-1"></div>
                                <div class="pin-dot" id="pdot-2"></div>
                                <div class="pin-dot" id="pdot-3"></div>
                                <div class="pin-dot" id="pdot-4"></div>
                            </div>
                            
                            <div class="pin-keypad">
                                <div class="pin-row">
                                    <div class="pin-btn" onclick="AuraCore.enterPinDigit('1')">1</div>
                                    <div class="pin-btn" onclick="AuraCore.enterPinDigit('2')">2</div>
                                    <div class="pin-btn" onclick="AuraCore.enterPinDigit('3')">3</div>
                                </div>
                                <div class="pin-row">
                                    <div class="pin-btn" onclick="AuraCore.enterPinDigit('4')">4</div>
                                    <div class="pin-btn" onclick="AuraCore.enterPinDigit('5')">5</div>
                                    <div class="pin-btn" onclick="AuraCore.enterPinDigit('6')">6</div>
                                </div>
                                <div class="pin-row">
                                    <div class="pin-btn" onclick="AuraCore.enterPinDigit('7')">7</div>
                                    <div class="pin-btn" onclick="AuraCore.enterPinDigit('8')">8</div>
                                    <div class="pin-btn" onclick="AuraCore.enterPinDigit('9')">9</div>
                                </div>
                                <div class="pin-row">
                                    <div class="pin-btn hidden-btn"></div>
                                    <div class="pin-btn" onclick="AuraCore.enterPinDigit('0')">0</div>
                                    <div class="pin-btn pin-action-btn" onclick="AuraCore.deletePinDigit()"><i class="fas fa-backspace"></i></div>
                                </div>
                            </div>
                        </div>

                        <!-- Bottom Shortcuts -->
                        <div class="lock-shortcuts">
                            <div class="shortcut-circle" title="Linterna"><i class="fas fa-bolt"></i></div>
                            <div class="shortcut-circle" title="Cámara" onclick="AuraCore.openApp('app-camera')"><i class="fas fa-camera"></i></div>
                        </div>
                    </div>
                </div>

                <!-- Home Indicator Bar (Swipe up to close app) -->
                <div class="home-indicator" id="home-indicator"></div>

            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="js/apps.js"></script>
    <script src="js/bank.js"></script>
    <script src="js/phone.js"></script>
    <script src="js/messages.js"></script>
    <script src="js/contacts.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/core.js"></script>
</body>
</html>
