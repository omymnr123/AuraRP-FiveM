<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraRP Progress</title>
    
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="progress-wrapper" class="progress-wrapper">
        <!-- Solo la barra minimalista AuraRP (Sin marcos pesados) -->
        <div class="progress-bar-container">
            <div id="progress-fill" class="progress-fill">
                <div class="progress-shimmer"></div>
            </div>
            <div class="progress-label-overlay">
                <span id="action-label" class="action-label">PROCESANDO...</span>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
