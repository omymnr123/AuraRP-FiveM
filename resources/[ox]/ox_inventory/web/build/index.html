<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link

    rel="stylesheet" />
  <title>Inventario Aura Roleplay</title>
  <script>
    // Preservar fetch y XMLHttpRequest nativos de Chromium CEF antes de que cualquier bundle los toque
    window.__auraNativeFetch = window.fetch;
    window.__auraNativeXHR = window.XMLHttpRequest;
  </script>
  <script type="module" crossorigin src="./assets/index.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index.css">
  <link rel="stylesheet" href="./assets/aura_inventory.css">
</head>

<body>
  <div id="root"></div>

  <!-- UI Structure & Spanish Localization Controller -->
  <script>
    (function () {
      let activeCategory = 'all';
      let searchQuery = '';

      // Diccionario de descripciones dinámicas para la tarjeta de pie
      const itemDescriptions = {
        'water': 'Botella de agua mineral natural pura de manantial. Hidrata por completo.',
        'burger': 'Deliciosa hamburguesa con queso y salsa. Sacia el apetito y recupera energía.',
        'sprunk': 'Lata de refresco carbonatado de lima-limón con electrolitos. Calma la sed.',

        'bandage': 'Venda elástica esterilizada para curar heridas leves y contener hemorragias.',
        'black_money': 'Fajos de billetes no declarados procedentes de actividades ilegales.',
        'money': 'Dólares estadounidenses en billetes de curso legal en circulación.',
        'cash': 'Dólares estadounidenses en billetes de curso legal en circulación.',
        'phone': 'Smartphone moderno con mensajería, llamadas, banca online y GPS.',
        'lockpick': 'Instrumento metálico fino para manipular bombines de cerraduras y puertas mecánicas.',

        'radio': 'Transmisor portátil de radiofrecuencia para comunicarse por frecuencias de voz.',
        'parachute': 'Equipo de paracaidismo deportivo de alta resistencia para saltos desde alturas.',
        'identification': 'Documento oficial con tus datos biométricos acreditados por el Estado.',
        'mastercard': 'Tarjeta bancaria con chip EMV asociada a tu cuenta bancaria personal.',
        'scrapmetal': 'Fragmentos de hierro y acero reciclable para herrería, mecánica o artesanía.'

      function setupUI() {
        const invWrapper = document.querySelector('.inventory-wrapper');
        if (!invWrapper) return;

        // 1. Inyectar Cabecera Superior en Español
        if (!document.querySelector('.aura-header-container')) {
          const header = document.createElement('div');
          header.className = 'aura-header-container';
          header.innerHTML = `
              <div class="aura-header-left">
                <div class="aura-header-title">INVENTARIO</div>
                <div class="aura-header-subtitle">DE TU PERSONAJE</div>
              </div>
              <div class="aura-header-divider"></div>
              <div class="aura-header-right">
                <div class="aura-header-logo-icon"></div>
                <span>AURA ROLEPLAY</span>
              </div>
            `;
          invWrapper.parentElement.insertBefore(header, invWrapper);
        }

        // 2. Inyectar Buscador y Filtros en Español dentro del panel izquierdo (Player)
        const leftGridWrapper = invWrapper.querySelector('.inventory-grid-wrapper:first-child');
        if (leftGridWrapper && !leftGridWrapper.querySelector('.aura-filter-container')) {
          const filterContainer = document.createElement('div');
          filterContainer.className = 'aura-filter-container';
          filterContainer.innerHTML = `
              <div class="aura-search-wrapper">
                <input type="text" class="aura-search-input" placeholder="Buscar artículo..." />
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              </div>
              <div class="aura-category-tabs">
                <button class="aura-category-tab active" data-cat="all">Todos</button>
                <button class="aura-category-tab" data-cat="weapons">Armas</button>
                <button class="aura-category-tab" data-cat="foods">Comida / Bebida</button>
                <button class="aura-category-tab" data-cat="craftable">Materiales</button>
                <button class="aura-category-tab" data-cat="clothes">Ropa</button>
              </div>
            `;

          const weightBar = leftGridWrapper.querySelector('.weight-bar');
          if (weightBar) {
            weightBar.after(filterContainer);
          } else {
            leftGridWrapper.prepend(filterContainer);
          }

          const searchInput = filterContainer.querySelector('.aura-search-input');
          searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            filterSlots();
          });

          const tabs = filterContainer.querySelectorAll('.aura-category-tab');
          tabs.forEach(tab => {
            tab.addEventListener('click', (e) => {
              tabs.forEach(t => t.classList.remove('active'));
              e.target.classList.add('active');
              activeCategory = e.target.dataset.cat;
              filterSlots();
            });
          });
        }

        // 3. Inyectar Barra Vertical de Ropa (AuraRP Luxury Sidebar en el lateral derecho del inventario)
        if (leftGridWrapper && !leftGridWrapper.querySelector('.aura-clothing-sidebar')) {
          const sidebar = document.createElement('div');
          sidebar.className = 'aura-clothing-sidebar';
          
          let buttonsHTML = '';
          clothingDefs.forEach(item => {
            buttonsHTML += `
              <button class="aura-clothing-btn active" data-clothing-type="${item.id}" data-tooltip="${item.label}">
                ${item.svg}
                <span class="aura-clothing-status-dot"></span>
                <span class="aura-clothing-tooltip">${item.label} (Puesta)</span>
              </button>
            `;
          });

          sidebar.innerHTML = buttonsHTML;
          leftGridWrapper.appendChild(sidebar);

          // Listeners de clic para cada botón de prenda
          sidebar.querySelectorAll('.aura-clothing-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
              e.preventDefault();
              e.stopPropagation();
              const type = btn.dataset.clothingType;
              if (type) {
                toggleClothingPiece(type);
              }
            });
          });
        }

        // 4. Inyectar Tarjeta de Detalle en Español al pie del panel izquierdo
        if (leftGridWrapper && !leftGridWrapper.querySelector('.aura-bottom-detail-card')) {
          const bottomCard = document.createElement('div');
          bottomCard.className = 'aura-bottom-detail-card';
          bottomCard.innerHTML = `
              <div class="aura-detail-icon-box" id="aura-detail-icon"></div>
              <div class="aura-detail-content">
                <div class="aura-detail-header-row">
                  <span class="aura-detail-name" id="aura-detail-name">Selecciona un artículo</span>
                  <span class="aura-detail-weight" id="aura-detail-weight">-</span>
                </div>
                <div class="aura-detail-desc" id="aura-detail-desc">Pasa el cursor sobre un objeto para ver su descripción.</div>
              </div>
            `;
          leftGridWrapper.appendChild(bottomCard);
        }
      }

        },
        { 
          id: 'glasses', 
          label: 'Gafas de Sol', 
          svg: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="13" r="3.5"></circle><circle cx="18" cy="13" r="3.5"></circle><path d="M9.5 13h5"></path><path d="M2.5 13L1 9.5"></path><path d="M21.5 13L23 9.5"></path><path d="M5 11.5l2 2"></path><path d="M17 11.5l2 2"></path></svg>' 
        },
        { 
          id: 'ear', 
          label: 'Pendientes / Oreja', 
          svg: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10c0-3.5 2.5-6 6-6s5 2 5 5c0 3-2 4.5-3 6.5s-.5 3.5-2.5 3.5-3.5-1.5-3.5-3"></path><path d="M11 9c0-1 1-2 2-2s2 1 2 2-1 2.5-2 3.5"></path><circle cx="10" cy="20" r="2" fill="currentColor"></circle></svg>' 
        },
        { 
          id: 'chain', 
          label: 'Cadena / Collar', 
          svg: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3c1 7 4 14 8 14s7-7 8-14"></path><path d="M6 3c1 5 3 11 6 11s5-6 6-11"></path><polygon points="12,17 15,22 9,22" fill="currentColor"></polygon></svg>' 
        },
        { 
          id: 'jacket', 
          label: 'Chaqueta / Top', 
          svg: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l4 3 4-3 4 3 4-3v17H4V4z"></path><path d="M8 7l4 6 4-6"></path><path d="M12 13v8"></path><path d="M4 4l-2 5 2 2"></path><path d="M20 4l2 5-2 2"></path></svg>' 
        },
        {

          svg: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3a4 4 0 0 0 8 0l4 3-2 4-2-1v12H8V9L6 10 4 6l4-3z"></path></svg>' 
        },
        { 
          id: 'vest', 
          label: 'Chaleco Antibalas', 
          svg: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h3l3 3 3-3h3l1 6-2 3v7H7v-7L5 9l1-6z"></path><path d="M9 11h6"></path><path d="M9 14h6"></path><path d="M9 17h6"></path></svg>' 
        },
        { 
          id: 'gloves', 
          label: 'Guantes', 
          svg: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 13V7a1.5 1.5 0 0 1 3 0v4"></path><path d="M9 10V5a1.5 1.5 0 0 1 3 0v5"></path><path d="M12 9V4a1.5 1.5 0 0 1 3 0v5"></path><path d="M15 10V6a1.5 1.5 0 0 1 3 0v6c0 4-3 6-5 6H9c-3 0-5-2-5-5v-3a2 2 0 0 1 3-1.5"></path><path d="M6 19h10"></path></svg>' 
        },
        { 
          id: 'pants', 
          label: 'Pantalones', 
          svg: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14l1 18-5-1-2-10-2 10-5 1L5 3z"></path><path d="M9 3v4h6V3"></path></svg>' 
        },
        { 
          id: 'shoes', 
          label: 'Zapatos / Calzado', 
          svg: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 17h20v4H2v-4z"></path><path d="M2 17v-4c0-2.5 2-4 4-4h3l3 4h7c2 0 3 1.5 3 4"></path><path d="M7 9l2 3"></path><path d="M10 9l2 3"></path></svg>' 
        },
        { 
          id: 'bag', 
          label: 'Mochila', 
          svg: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="6" width="14" height="15" rx="3"></rect><path d="M9 6V3h6v3"></path><path d="M9 11h6"></path><path d="M9 15h6"></path><path d="M5 10H3v7h2"></path><path d="M19 10h2v7h-2"></path></svg>' 
        },
        { 
          id: 'watch', 
          label: 'Reloj', 
          svg: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6"></circle><polyline points="12 9 12 12 14 12"></polyline><path d="M9 6V2h6v4"></path><path d="M9 18v4h6v-4"></path></svg>' 
        },
        { 
          id: 'bracelet', 
          label: 'Pulsera', 
          svg: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="9" ry="5"></ellipse><ellipse cx="12" cy="12" rx="6" ry="3" stroke-dasharray="2 3"></ellipse><circle cx="12" cy="17" r="1.5" fill="currentColor"></circle></svg>' 
        }
      ];

      // Estado local de Prendas
      let clothingState = {
        hat: true,
        mask: true,
        glasses: true,
        ear: true,
        chain: true,
        jacket: true,
        tshirt: true,
        vest: true,
        gloves: true,
        pants: true,
        shoes: true,
        bag: true,
        watch: true,
        bracelet: true
      };

      // Obtener nombre del recurso FiveM seguro
      function getResourceName() {
        return (typeof window.GetParentResourceName === 'function') ? window.GetParentResourceName() : 'ox_inventory';
      }

      // Actualizar visualmente los botones de ropa
      function updateClothingUI() {
        clothingDefs.forEach(item => {
          const btn = document.querySelector(`.aura-clothing-btn[data-clothing-type="${item.id}"]`);
          const isWorn = clothingState[item.id] !== false;

          if (btn) {
            btn.classList.toggle('active', isWorn);
            btn.classList.toggle('inactive', !isWorn);
            const tooltip = btn.querySelector('.aura-clothing-tooltip');
            if (tooltip) {
              tooltip.textContent = `${item.label} (${isWorn ? 'Puesta - Clic para quitar' : 'Quitada - Clic para poner'})`;
            }
          }
        });
      }

      // Helper robusto para peticiones NUI en FiveM CEF
      async function postNui(endpoint, data, callback) {
        console.log('[Aura Clothing] POST NUI:', endpoint, JSON.stringify(data));
        try {
          // 1. Usar el transporter nativo exportado desde ox_inventory (index.js)
          if (typeof window.__auraFetchNui === 'function') {
            const res = await window.__auraFetchNui(endpoint, data || {});
            console.log('[Aura Clothing] Result from __auraFetchNui:', JSON.stringify(res));
            if (callback) callback(res);
            return res;
          }

          // 2. Fallback con el fetch real preservado
          const fetchFn = window.__auraNativeFetch || window.fetch;
          const resource = (typeof window.GetParentResourceName === 'function')
            ? window.GetParentResourceName()
            : 'ox_inventory';

          const res = await fetchFn('https://' + resource + '/' + endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json; charset=UTF-8' },
            body: JSON.stringify(data || {})
          });

          const json = res && typeof res.json === 'function' ? await res.json() : null;
          console.log('[Aura Clothing] Result from native fetch:', JSON.stringify(json));
          if (callback) callback(json);
          return json;
        } catch (err) {
          console.warn('[Aura Clothing] Error in postNui:', err);
          if (callback) callback(null);
          return null;
        }
      }

      // Alternar Prenda vía NUI POST seguro
      function toggleClothingPiece(type) {
        console.log('[Aura Clothing] toggleClothingPiece called with type:', type);
        postNui('aura_toggleClothing', { type: type }, function (data) {
          console.log('[Aura Clothing] toggleClothing callback data:', JSON.stringify(data));
          if (data && data.state) {
            clothingState = data.state;
            updateClothingUI();
          }
        });
      }

      // Obtener Estado de Ropa al abrir inventario
      function fetchClothingState() {
        postNui('aura_getClothingState', {}, function (data) {
          if (data && data.state) {
            clothingState = data.state;
            updateClothingUI();
          }
        });
      }

      // Filtro en vivo de slots
      function filterSlots() {
        const leftGrid = document.querySelector('.inventory-grid-wrapper:first-child .inventory-grid-container');
        if (!leftGrid) return;

        const slots = leftGrid.querySelectorAll('.inventory-slot');
        slots.forEach(slot => {
          const labelEl = slot.querySelector('.inventory-slot-label-text');
          const itemName = labelEl ? labelEl.textContent.toLowerCase() : '';
          const bgImage = slot.style.backgroundImage || '';
          const hasItem = bgImage && bgImage !== 'none' && !bgImage.includes('none');

          if (!hasItem && (searchQuery || activeCategory !== 'all')) {
            slot.style.display = 'none';
            return;
          }

          let matchesSearch = !searchQuery || itemName.includes(searchQuery);
          let matchesCategory = true;

          if (activeCategory === 'weapons') {
            matchesCategory = itemName.includes('arma') || itemName.includes('pistola') || itemName.includes('rifle') || itemName.includes('cuchillo') || itemName.includes('munición') || itemName.includes('weapon');
          } else if (activeCategory === 'foods') {
            matchesCategory = itemName.includes('hamburguesa') || itemName.includes('agua') || itemName.includes('sprunk') || itemName.includes('cola') || itemName.includes('comida') || itemName.includes('mostaza') || itemName.includes('burger');
          } else if (activeCategory === 'craftable') {
            matchesCategory = itemName.includes('metal') || itemName.includes('chatarra') || itemName.includes('ganzúa') || itemName.includes('material') || itemName.includes('lockpick');
          } else if (activeCategory === 'clothes') {
            matchesCategory = itemName.includes('ropa') || itemName.includes('chaleco') || itemName.includes('prenda') || itemName.includes('paracaídas') || itemName.includes('vest');
          }

          slot.style.display = (matchesSearch && matchesCategory) ? 'flex' : 'none';
        });
      }

      // Detección de Hover sobre ítems para alimentar la tarjeta de inspección en Español
      document.addEventListener('mouseover', (e) => {
        const slot = e.target.closest('.inventory-slot');
        if (!slot) return;

        const labelEl = slot.querySelector('.inventory-slot-label-text');
        const countEl = slot.querySelector('.item-slot-info-wrapper p');
        const bgImage = slot.style.backgroundImage;

        if (labelEl && bgImage && bgImage !== 'none' && !bgImage.includes('none')) {
          const nameEl = document.getElementById('aura-detail-name');
          const weightEl = document.getElementById('aura-detail-weight');
          const descEl = document.getElementById('aura-detail-desc');
          const iconEl = document.getElementById('aura-detail-icon');

          const labelText = labelEl.textContent.trim();
          if (nameEl) nameEl.textContent = labelText;
          if (weightEl) weightEl.textContent = countEl ? countEl.textContent : '1x';
          if (iconEl) iconEl.style.backgroundImage = bgImage;

          // Extraer nombre del archivo del ítem para obtener su descripción precisa
          const rawFileNameMatch = bgImage.match(/\/([^/]+)\.(?:png|jpg|webp)/i);
          const rawItemKey = rawFileNameMatch ? rawFileNameMatch[1].toLowerCase() : labelText.toLowerCase();
          const resolvedDesc = itemDescriptions[rawItemKey] || `Artículo homologado en Los Santos. Disponible para uso o intercambio.`;

          if (descEl) descEl.textContent = resolvedDesc;
        }
      });

      // Controlador de Posicionamiento Dinámico del Cinturón (F1)
      function setHotbarPos(x, y) {
        if (x !== undefined && y !== undefined) {
          document.documentElement.style.setProperty('--hotbar-left', x + '%');
          document.documentElement.style.setProperty('--hotbar-bottom', y + '%');
          document.documentElement.style.setProperty('--hotbar-transform', 'none');
          try {
            localStorage.setItem('aura_hotbar_pos', JSON.stringify({ x: Number(x), y: Number(y) }));
          } catch(e) {}
        }
      }

      // Carga instantánea de la posición guardada
      try {
        const savedHotbar = localStorage.getItem('aura_hotbar_pos');
        if (savedHotbar) {
          const p = JSON.parse(savedHotbar);
          if (p && p.x !== undefined && p.y !== undefined) {
            setHotbarPos(p.x, p.y);
          }
        }
      } catch(e) {}

      window.addEventListener('message', function(e) {
        if (e.data && e.data.action === 'setHotbarPosition') {
          setHotbarPos(e.data.x, e.data.y);
        }
        if (e.data && e.data.action === 'setClothingState') {
          if (e.data.state) {
            clothingState = e.data.state;
            updateClothingUI();
          }
        }
        if (e.data && (e.data.action === 'setupInventory' || e.data.action === 'openInventory')) {
          fetchClothingState();
        }
      });

      const observer = new MutationObserver(() => {
        setupUI();
        updateClothingUI();
      });

      observer.observe(document.body, { childList: true, subtree: true });
    })();
  </script>
</body>
