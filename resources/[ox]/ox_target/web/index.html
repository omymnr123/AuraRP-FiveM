<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free/css/all.min.css" />
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <div id="target-cursor" class="target-cursor">
      <div class="cursor-glow"></div>
      <div class="cursor-pulse"></div>
      <div class="cursor-ring"></div>
      <div class="cursor-reticle">
        <span class="reticle-corner top-left"></span>
        <span class="reticle-corner top-right"></span>
        <span class="reticle-corner bottom-left"></span>
        <span class="reticle-corner bottom-right"></span>
      </div>
      <div class="cursor-dot"></div>
    </div>

    <div id="options-wrapper" class="options-wrapper"></div>
    <script defer type="module" src="js/main.js"></script>
  </body>
</html>
