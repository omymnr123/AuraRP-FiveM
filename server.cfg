# This file is a minimal version of the default config file.
# This is NOT supposed to be enough for most servers.
# Please read the fivem documentation:
#   https://aka.cfx.re/server-commands
#   https://docs.fivem.net/docs/server-manual/setting-up-a-server/

## You SHOULD edit the following:
sv_hostname "AuraRP built with FiveM Basic Server!"
sets sv_projectName "[FiveM Basic Server] AuraRP"
sets sv_projectDesc "Recipe for the base resources required to run a minimal FiveM server."
sets tags "default, deployer"
sets locale "es-ES"

## You CAN edit the following:
# Game Build (mp2025_02 - A Safehouse in the Hills)
sv_enforceGameBuild 3751
sv_licenseKey "cfxk_f2UmjYqzyQ2QLmeOe2nB_4Dm6PN"
sv_maxclients 48
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
set steam_webApiKey "none"
set resources_useSystemChat true

# Database Connection
set mysql_connection_string "mysql://root@127.0.0.1/aurarp?charset=utf8mb4"

# Security setting for state bags (Recommended by ox_lib)
setr sv_stateBagStrictMode true

# Ox & Locale Configuration (Spanish)
setr ox:locale "es"
setr inventory:locale "es"
setr inventory:framework "aura"
setr inventory:slots 50
setr inventory:weight 30000
set inventory:accounts '["money", "black_money"]'

## These resources will start by default.
ensure mapmanager
ensure chat
ensure spawnmanager
ensure basic-gamemode
ensure [ox]
ensure [local]
ensure [mlo]

## Add system admins
# Allow all commands for admin group
add_ace group.admin command allow
# But don't allow quit for admin group
add_ace group.admin command.quit deny
# Admin principal for omymnr
add_principal identifier.fivem:8326319 group.admin

